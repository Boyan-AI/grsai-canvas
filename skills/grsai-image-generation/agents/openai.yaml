interface:
  display_name: "Grsai Image Generation"
  short_description: "通过 Grsai 为 Codex 安全地生成、编辑并下载图片"
  default_prompt: "Use $grsai-image-generation to generate and download an image from my prompt."
dependencies:
  tools:
    - type: "mcp"
      value: "grsai-image"
      description: "Generate images, query tasks, and download results through Grsai"
      transport: "stdio"
policy:
  allow_implicit_invocation: true
